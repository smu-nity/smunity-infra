services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml.template:/prometheus/prometheus.yml.template
      - ./prometheus/entrypoint.sh:/entrypoint.sh
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    environment:
      - TARGET_HOST=${TARGET_HOST}
    entrypoint:
      - /bin/sh
      - /entrypoint.sh

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - 9093:9093
    environment:
      - SLACK_WEBHOOK=${SLACK_WEBHOOK}
    volumes:
      - ./alertmanager/config.yml.template:/etc/alertmanager/config.yml.template
      - ./alertmanager/alertmanager-entrypoint.sh:/entrypoint.sh
    entrypoint:
      - /bin/sh
      - /entrypoint.sh

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - ./grafana:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml

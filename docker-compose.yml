services:
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    environment:
      - TARGET_HOST=${TARGET_HOST:-host.docker.internal:8080}
    volumes:
      - ./prometheus/prometheus.yml.template:/prometheus/prometheus.yml.template
      - ./prometheus/entrypoint.sh:/entrypoint.sh
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    ports:
      - "9090:9090"
    networks: [ smunity ]
    entrypoint:
      - /bin/sh
      - /entrypoint.sh
    restart: always

  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager:latest
    environment:
      - SLACK_WEBHOOK=${SLACK_WEBHOOK:-https://hooks.slack.com}
    volumes:
      - ./alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template
      - ./alertmanager/entrypoint.sh:/entrypoint.sh
    ports:
      - "9093:9093"
    networks: [ smunity ]
    depends_on:
      - prometheus
    entrypoint:
      - /bin/sh
      - /entrypoint.sh
    restart: always

  loki:
    container_name: loki
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks: [ smunity ]
    restart: always

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    environment:
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [ smunity ]
    depends_on:
      - prometheus
      - loki
    restart: always

volumes:
  grafana-data:

networks:
  smunity:
    external: true
